worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Keine Zugriffsprotokolle (so steht es auch in der Datenschutzerklärung).
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # YouTube nur im iframe (nach Klick), alles andere kommt vom eigenen Server.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'none'" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Schriften, Bilder, CSS und JS dürfen eine Weile im Browser-Cache bleiben.
        location ~* \.(woff2|svg|png|jpe?g|webp|css|js)$ {
            expires 7d;
        }
    }
}
