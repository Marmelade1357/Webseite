worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Keine Zugriffsprotokolle (so steht es auch in der Datenschutzerklärung).
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml model/gltf-binary;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # YouTube nur im iframe (nach Klick), alles andere kommt vom eigenen Server.
        # Inline-Skripte nur per Hash erlaubt. Ändert sich ein Inline-Skript (Import-Map, js-Klasse,
        # Mail-Skript im Impressum), muss der Hash hier neu berechnet werden (siehe README).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CmdlgsRAk9ZIeXy65Hqw0vq1o7eJWZnbPTvyjBgsPRo=' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' 'sha256-M90VaZecPp7vnlO45c5oHtIUiPUyFHqfNZdcTmpoFP4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'self'" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # 3D-Modelle: Dateityp fehlt in den Standard-mime.types, daher nur hier gesetzt.
        location ~* \.glb$ {
            types { model/gltf-binary glb; }
            expires 7d;
        }

        # Schriften, Bilder, CSS und JS dürfen eine Weile im Browser-Cache bleiben.
        location ~* \.(woff2|svg|png|jpe?g|webp|css|js)$ {
            expires 7d;
        }
    }
}
