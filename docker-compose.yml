name: webseite

services:
  app:
    build: .
    environment:
      - TZ=Europe/Berlin
    ports:
      # Nur intern auf dem Pi erreichbar (127.0.0.1:8104) - der Reverse Proxy des Pi
      # routet die Hauptdomain (oualid.de) hierher. Port 8104 gewählt, weil 8080/8081
      # und 8090-8103 schon von den Spielen, dem Spielehub und der iPhone-Seite belegt sind.
      - "127.0.0.1:8104:80"
    restart: unless-stopped
    # Prüft jede Minute, ob nginx antwortet. Status sichtbar mit: docker compose ps
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
